services:
  - type: web
    name: team-pulse-fa
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: team-pulse-db
          property: connectionString
      - key: SETUP_TOKEN
        generateValue: true
databases:
  - name: team-pulse-db
    plan: free
    region: frankfurt
    databaseName: team_pulse
    ipAllowList: []
